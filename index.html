<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCTU GPA Calculator</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #0f766e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --accent: #2dd4bf; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 2rem; }
  .row { display: grid; grid-template-columns: 1fr 5rem 5.5rem 2rem; gap: .5rem; margin-bottom: .5rem; }
  .head { color: var(--muted); font-size: .85rem; }
  input, select, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: .4rem .5rem; min-width: 0; }
  button { cursor: pointer; }
  button.remove { border: none; color: var(--muted); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .actions { display: flex; gap: .5rem; margin-top: 1rem; }
  output { display: block; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .gpa { font-size: 2.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cls { color: var(--accent); font-weight: 500; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .85rem; }
  table { border-collapse: collapse; } td { padding: 0 1rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>GPA Calculator</h1>
  <p class="sub">For GCTU's 4.0 grading scale. Your courses stay in this browser.</p>

  <div class="row head" aria-hidden="true"><span>Course</span><span>Credits</span><span>Grade</span><span></span></div>
  <div id="rows"></div>
  <div class="actions">
    <button id="add" type="button">Add course</button>
    <button id="clear" type="button">Clear</button>
  </div>

  <output id="result" aria-live="polite"></output>

  <footer>
    <details><summary>Grading scale used</summary><table id="scale"></table></details>
    <p>Check your student handbook for the official scale. <a href="https://github.com/nadeem0305/gctu-gpa">Source</a></p>
  </footer>
</main>

<template id="row">
  <div class="row">
    <input name="name" aria-label="Course name" placeholder="e.g. Data Structures">
    <input name="credits" aria-label="Credit hours" type="number" min="0" step="1" inputmode="numeric" value="3">
    <select name="grade" aria-label="Grade"><option value="">–</option></select>
    <button class="remove" type="button" aria-label="Remove course">✕</button>
  </div>
</template>

<script type="module">
import { GRADES, CLASSES, gpa, classOf } from "./gpa.js";

const rows = document.getElementById("rows");
const tpl = document.getElementById("row");
const KEY = "gctu-gpa-courses";

document.getElementById("scale").innerHTML = Object.entries(GRADES)
  .map(([g, p]) => `<tr><td>${g}</td><td>${p.toFixed(1)}</td></tr>`).join("");

function addRow(c = {}) {
  const el = tpl.content.firstElementChild.cloneNode(true);
  const sel = el.querySelector("select");
  for (const g of Object.keys(GRADES)) sel.add(new Option(g, g));
  el.querySelector("[name=name]").value = c.name ?? "";
  if (c.credits !== undefined) el.querySelector("[name=credits]").value = c.credits;
  sel.value = c.grade ?? "";
  el.querySelector(".remove").onclick = () => { el.remove(); update(); };
  rows.append(el);
  return el;
}

function read() {
  return [...rows.children].map(r => ({
    name: r.querySelector("[name=name]").value,
    credits: r.querySelector("[name=credits]").value,
    grade: r.querySelector("[name=grade]").value,
  }));
}

function update() {
  const courses = read();
  try { localStorage.setItem(KEY, JSON.stringify(courses)); } catch {}
  const { gpa: g, credits } = gpa(courses);
  document.getElementById("result").innerHTML = g == null
    ? `<span class="sub">Pick a grade for at least one course.</span>`
    : `<div class="gpa">${g.toFixed(2)}</div><div class="cls">${classOf(g)}</div><div class="sub">${credits} credit hours</div>`;
}

rows.addEventListener("input", update);
document.getElementById("add").onclick = () => { addRow().querySelector("input").focus(); update(); };
document.getElementById("clear").onclick = () => { rows.replaceChildren(); addRow(); update(); };

let saved = [];
try { saved = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
(saved.length ? saved : [{}, {}, {}]).forEach(addRow);
update();
</script>
</body>
</html>
